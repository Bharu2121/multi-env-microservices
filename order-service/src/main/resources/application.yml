server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8083}
